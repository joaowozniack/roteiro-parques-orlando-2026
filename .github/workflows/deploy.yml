name: Publicar guia no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Conferir Node e npm
        run: |
          node --version
          npm --version
      - name: Instalar dependências
        timeout-minutes: 10
        env:
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          NPM_CONFIG_FETCH_RETRIES: '2'
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '5000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '15000'
        run: npm ci --no-audit --no-fund --prefer-offline --foreground-scripts --loglevel=info
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
